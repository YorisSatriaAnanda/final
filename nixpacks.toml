[phases.setup]
nixPkgs = ["...", "php83", "nodejs", "npm"]

[phases.build]
cmds = [
    "composer install --no-dev --optimize-autoloader",
    "npm ci",
    "npm run build",
]

[start]
cmd = "php artisan migrate --force && php artisan config:cache && php artisan route:cache && php artisan view:cache && php-fpm -y /assets/php-fpm.conf & nginx -c /etc/nginx/nginx.conf"
